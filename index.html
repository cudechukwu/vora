<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#13324a" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <title>VORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;background:#0b120e;}
    body{
      font-family:'JetBrains Mono',monospace;
      -webkit-user-select:none;user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:none;
    }
    #app{position:fixed;inset:0;}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
    /* boot splash */
    #boot{
      position:fixed;inset:0;z-index:10;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#0b120e;color:#00ff88;gap:14px;
      transition:opacity .6s ease;
    }
    #boot .logo{font-size:13px;letter-spacing:.5em;font-weight:700;}
    #boot .sub{font-size:10px;letter-spacing:.2em;color:#5a6b5e;}
    #boot.hide{opacity:0;pointer-events:none;}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <div class="logo">V O R A</div>
    <div class="sub">SIM.LAYER.01 — WES_PILOT_α</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
